<!doctype html>
<html><head><meta charset="utf-8">
<!-- The eight room posters, drawn as isometric voxel scenes that loop.
     poster.html?i=0 … ?i=7 shows one (add &t=0.5 for a moment in its
     loop); window.frame(t) redraws it at t in 0…1. render.js writes the
     stills to art/, loops.js the four-second loops to media/loops/. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
html,body{margin:0;background:#fff}
svg{display:block}
</style>
<script src="iso.js"></script>
</head><body>
<div id="out"></div>
<script>
const INK='#17161C', RED='#D62222', AMB='#F2A83B', IND='#2B3550', PAPER='#FCFBF7', CREAM='#F3EBDD';
const WOOD='#C98B55', WOODD='#9A6438', GREEN='#5DAE6B', GREEND='#3E8A52', SKY='#7CC3E8', WATER='#4BA3D9', STONE='#A9A6A0', LIL='#7B6FD6';
const W=1600, H=900;
const q = new URLSearchParams(location.search), I = +(q.get('i')||0);

/* ── shared chrome ─────────────────────────────────────── */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function chrome(o){
  const dark = !!o.dark, ink = dark ? '#F4F2EC' : INK, ink2 = dark ? 'rgba(244,242,236,.72)' : '#4A4850';
  let s = '';
  s += `<rect width="${W}" height="${H}" fill="${o.bg}"/>`;
  /* dot grid */
  s += `<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="${dark?'rgba(255,255,255,.07)':'rgba(23,22,28,.07)'}"/></pattern>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${o.halo||'#fff'}" stop-opacity="${dark?.18:.75}"/><stop offset="1" stop-color="${o.halo||'#fff'}" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect width="${W}" height="${H}" fill="url(#dots)"/>`;
  s += `<ellipse cx="${o.hx||1195}" cy="${o.hy||430}" rx="560" ry="420" fill="url(#halo)"/>`;
  /* the red corner tab, the house's one signature */
  s += `<path d="M0 0H92L0 92Z" fill="${RED}"/>`;
  /* kicker */
  s += `<g font-family="JetBrains Mono" font-size="20" letter-spacing="4">
    <rect x="100" y="132" width="34" height="3" fill="${RED}"/>
    <text x="150" y="142" fill="${RED}">ROOM ${String(I).padStart(2,'0')}</text>
    <text x="${150+ 7*16.2 + 18}" y="142" fill="${ink2}">—  ${esc(o.kicker)}</text></g>`;
  /* headline */
  const hl = o.title, fs = o.fs || 104;
  hl.forEach((line, k) => {
    const y = 250 + k*fs*0.98;
    s += `<text class="hl" x="96" y="${y}" font-family="Fraunces" font-weight="800" font-size="${fs}" letter-spacing="-3" fill="${line.accent ? RED : ink}">${esc(line.t)}</text>`;
  });
  const ly = 250 + (hl.length-1)*fs*.98 + 74;
  (o.lede||[]).forEach((l, k) => {
    s += `<text x="100" y="${ly + k*40}" font-family="Inter" font-weight="500" font-size="28" fill="${ink2}">${esc(l)}</text>`;
  });
  /* chips */
  let cx = 100;
  (o.chips||[]).forEach((c, k) => {
    const w = c.length*13.4 + 34;
    const hot = k < (o.hot||0);
    s += `<g font-family="JetBrains Mono" font-size="17" letter-spacing="2">
      <rect x="${cx}" y="${H-150}" width="${w}" height="44" rx="10" fill="${hot?RED:(dark?'rgba(255,255,255,.08)':'#fff')}" stroke="${hot?RED:(dark?'rgba(255,255,255,.25)':'rgba(23,22,28,.22)')}" stroke-width="2"/>
      <text x="${cx+17}" y="${H-122}" fill="${hot?'#fff':ink}">${esc(c.toUpperCase())}</text></g>`;
    cx += w + 12;
  });
  /* signature */
  s += `<g transform="translate(${W-300},${H-92})">
    <g transform="scale(.62)"><path d="M32 9 54 21.5 32 34 10 21.5Z" fill="${AMB}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M10 21.5 32 34v20.5L10 42Z" fill="${RED}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M54 21.5 32 34v20.5L54 42Z" fill="${IND}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/></g>
    <text x="50" y="27" font-family="JetBrains Mono" font-size="17" letter-spacing="3" fill="${ink}">AAYUSH KUMAR</text></g>`;
  return s;
}
/* ── time: T runs 0→1 over one loop; everything below is periodic in it ── */
let T = 0;
const TAU = Math.PI*2;
const S = (k, ph) => Math.sin(TAU*(k*T + (ph||0)));
const step = n => Math.floor(T*n + 1e-6) % n;
const hash = (a,b,c) => { const x = Math.sin(a*127.1 + b*311.7 + c*74.7)*43758.5453; return x - Math.floor(x); };
const bob = (svg, amp, ph, k) => `<g transform="translate(0,${(amp*S(k||1, ph||0)).toFixed(2)})">${svg}</g>`;

/* action marks — the little burst lines from the sticker art */
function burst(x, y, r, a0, a1, n, col, len){
  let s=''; for(let k=0;k<n;k++){ const a=(a0+(a1-a0)*k/(n-1))*Math.PI/180;
    const x0=x+Math.cos(a)*r, y0=y+Math.sin(a)*r, x1=x+Math.cos(a)*(r+(len||34)), y1=y+Math.sin(a)*(r+(len||34));
    s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${col}" stroke-width="10" stroke-linecap="round"/>`; }
  const o = (.55 + .45*(.5 + .5*S(2, x*.0007))).toFixed(3);
  return `<g opacity="${o}">${s}</g>`;
}
function spark(x,y,r,col){
  const k = (.7 + .45*(.5 + .5*S(2, (x+y)*.0013))).toFixed(3), a = (S(1, x*.001)*18).toFixed(1);
  return `<g transform="translate(${x},${y}) rotate(${a}) scale(${k}) translate(${-x},${-y})">${sparkRaw(x,y,r,col)}</g>`;
}
function sparkRaw(x,y,r,col){ return `<path d="M${x} ${y-r}Q${x} ${y} ${x+r} ${y}Q${x} ${y} ${x} ${y+r}Q${x} ${y} ${x-r} ${y}Q${x} ${y} ${x} ${y-r}Z" fill="${col}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`; }
function cube(x,y,s,col){ const sc=new IsoScene(s,x,y); sc.set(0,0,0,col); return sc.render(); }
function shadow(x,y,rx,ry,o){ return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#17161C" opacity="${o||.12}"/>`; }

/* screen-space text placed on an iso face (x-facing or y-facing) */
function faceText(sc, x, y, z, txt, size, col, face){
  const p = sc.P(x,y,z);
  const m = face==='y' ? 'matrix(0.866,0.5,0,1,0,0)' : 'matrix(0.866,-0.5,0,1,0,0)';
  return `<g transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)}) ${m}"><text font-family="JetBrains Mono" font-size="${size}" fill="${col}">${esc(txt)}</text></g>`;
}

/* ── the eight scenes ───────────────────────────────────── */
const SC = [];

/* 00 · Lobby — a cut-away room, the mark grown into a diorama */
SC[0] = function(){
  const base = chrome({ bg:'#F4E9D8', halo:'#FFF6E6', kicker:'LOBBY',
    title:[{t:'Come on in.'},{t:'Eight rooms.',accent:true}], fs:100,
    lede:['Games, engines and the AI that runs them —','one builder, one house, a room for each.'],
    chips:['Game dev','AI / Backend','Tools'], hot:1 });
  let s='';
  const sc = new IsoScene(30, 1090, 250);
  const FL='#EADBC4', WL=RED, WR=IND;
  sc.box(0,13,0,13,0,0,WOOD);                         // floor
  for(let x=0;x<=13;x++) for(let y=0;y<=13;y++) if((x+y)%2===0) sc.set(x,y,0,'#D9A06C');
  sc.box(0,13,-1,-1,0,9,WR);                          // back-right wall (y=-1)
  sc.box(-1,-1,0,13,0,9,WL);                          // back-left wall (x=-1)
  sc.box(-1,-1,-1,-1,0,9,INK);
  sc.box(-1,13,-1,-1,10,10,'#F2A83B'); sc.box(-1,-1,-1,13,10,10,'#F2A83B'); // roof trim
  sc.del(3,6,-1,-1,4,7); sc.box(3,6,-1,-1,4,7,SKY,{glow:true}); // window
  sc.box(4,5,-1,-1,4,7,'#BFE3F5',{glow:true});
  sc.del(-1,-1,3,6,1,7); sc.box(-1,-1,3,6,1,7,'#7A2020');      // door
  sc.set(-1,6,4,AMB);
  // rug
  sc.box(4,10,5,11,1,1,'#E7C7A0'); sc.box(5,9,6,10,1,1,RED); sc.box(6,8,7,9,1,1,'#F4E9D8');
  // desk + monitor
  sc.box(8,12,0,2,1,4,'#F5F0E6'); sc.del(9,11,0,2,1,3); sc.box(8,8,0,2,1,3,'#E0D6C4'); sc.box(12,12,0,2,1,3,'#E0D6C4');
  sc.box(9,11,0,0,5,7,INK); sc.box(9,11,1,1,5,7,'#2C2B33'); sc.box(10,10,0,0,4,4,INK);
  sc.box(9,11,1,1,6,6,step(4)%2 ? '#7CC3E8' : '#4BD18B',{glow:true}); sc.set(9,1,7,step(8)%2 ? AMB : RED,{glow:true});
  // chair
  sc.box(9,11,4,6,1,3,IND); sc.box(9,11,6,6,4,6,IND);
  // plant
  sc.box(0,1,11,12,1,2,'#F5F0E6'); sc.box(0,1,11,12,3,5,GREEN); sc.set(0,11,6,GREEND); sc.set(1,12,6,GREEN);
  // shelf on left wall with cubes
  sc.box(0,0,1,2,6,6,WOOD); sc.set(0,1,7,AMB); sc.set(0,2,7,RED);
  // a big red cube in the middle, floating
  let s2 = sc.render();
  s += s2;
  const hop = Math.abs(Math.sin(TAU*T));
  s += shadow(1360, 770, 50 - hop*16, 12 - hop*4, .14 - hop*.06);
  s += `<g transform="translate(0,${(-hop*70).toFixed(1)})">${cube(1320, 600, 46, RED)}</g>`;
  s += burst(1360, 640, 90, -70, -20, 3, AMB, 30);
  s += spark(900, 300, 22, AMB) + spark(1460, 260, 14, '#fff') + spark(1500, 470, 18, RED);
  return [base, s];
};

/* 01 · Practice — the workbench */
SC[1] = function(){
  const base = chrome({ bg:'#DCE7D6', halo:'#F3FAEE', kicker:'PRACTICE',
    title:[{t:'Systems that'},{t:'make things.',accent:true}],
    lede:['Unity and C# for engines, Python for Blender,','Three.js for the web, FastAPI behind it all.'],
    chips:['Unity','C#','Python','Three.js','FastAPI'], hot:2 });
  let s='';
  const sc = new IsoScene(26, 1080, 260);
  // big desk
  sc.box(0,17,0,9,6,7,'#E2B07E'); sc.box(0,17,0,0,6,7,WOOD);
  sc.box(0,1,0,9,0,5,WOODD); sc.box(16,17,0,9,0,5,WOODD); sc.box(2,15,8,9,1,1,WOODD);
  // drawers
  sc.box(12,15,9,9,2,5,'#F3EEE4'); sc.set(13,9,4,INK); sc.set(14,9,4,INK); sc.set(13,9,2,INK);
  // monitors
  sc.box(3,10,1,1,10,15,INK); sc.box(4,9,2,2,11,14,'#24232B'); sc.box(6,7,1,1,8,9,'#3A3942'); sc.box(5,8,1,2,8,8,'#3A3942');
  [[11,AMB],[12,'#4BD18B'],[13,'#7CC3E8'],[14,'#F07070']].forEach((r,k)=>{ sc.box(4,4+1+((k*2 + step(6))%5),2,2,r[0],r[0],r[1],{glow:true}); });
  sc.box(11,15,2,2,9,13,INK); sc.box(12,14,3,3,10,12,IND); sc.box(12,13,3,3,11,11,'#9CA6FF',{glow:true});
  sc.box(13,13,2,2,8,8,'#3A3942');
  // keyboard + mouse
  sc.box(4,10,5,6,8,8,'#F7F5F0'); sc.box(12,12,6,6,8,8,'#F7F5F0');
  // mug
  sc.box(14,15,5,6,8,9,RED); sc.set(16,5,9,RED);
  // cubes / blocks stack (unity-ish)
  sc.box(1,2,5,6,8,9,AMB); sc.box(1,1,5,5,10,10,IND);
  let r = sc.render();
  s += r;
  // floating icons: brackets, gear
  s += bob(`<g transform="translate(1340,170)"><rect x="-58" y="-40" width="116" height="80" rx="16" fill="${INK}" stroke="${INK}" stroke-width="3"/>
    <text x="0" y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="44" fill="${AMB}">&lt;/&gt;</text></g>`, 12, 0);
  s += bob(`<g transform="translate(840,250)"><circle r="44" fill="#fff" stroke="${INK}" stroke-width="3"/><text y="16" text-anchor="middle" font-family="JetBrains Mono" font-size="40" fill="${RED}">C#</text></g>`, 14, .33);
  s += bob(`<g transform="translate(1480,380)"><circle r="38" fill="${AMB}" stroke="${INK}" stroke-width="3"/><text y="13" text-anchor="middle" font-family="JetBrains Mono" font-size="34" fill="${INK}">py</text></g>`, 12, .66);
  s += burst(1340, 170, 80, 200, 250, 3, RED, 26);
  s += spark(980, 140, 18, AMB) + spark(1520, 610, 16, '#fff');
  s += shadow(1110, 790, 330, 34, .1);
  return [base, s];
};

/* 02 · Arthis — the phone feed and the vertical city */
SC[2] = function(){
  const base = chrome({ bg:'#E3E0F3', halo:'#F7F5FF', kicker:'TWO LIVE PLATFORMS',
    title:[{t:'Arthis.Space'},{t:'Arthis.Land',accent:true}], fs:96,
    lede:['A swipe-up feed of mini-games, and a','vertical city you climb with friends.'],
    chips:['Unity','WebGL','PostgreSQL','MCP agents'], hot:2 });
  let s='';
  const sc = new IsoScene(22, 1010, 210);
  // ground plate
  sc.box(0,22,0,14,0,0,'#CFC9EC'); sc.box(0,22,0,14,0,0,'#D9D4F2');
  for(let x=0;x<=22;x+=2) sc.box(x,x,0,14,0,0,'#CCC6EA');
  // the city tower "The Wall"
  const cols=[RED,AMB,IND,'#5DAE6B',LIL,'#F07070'];
  for(let lv=0; lv<7; lv++){
    const z0 = 1+lv*3, c = cols[lv%cols.length];
    sc.box(14,20,3,8,z0,z0+2,'#F6F3EA');
    sc.box(14,20,8,8,z0,z0, shade(c,1)); // floor band
    for(let x=15;x<=19;x+=2) sc.box(x,x,8,8,z0+1,z0+1, hash(x,lv,step(6)) > .3 ? (lv%2? '#FFE08A':'#BDE6FF') : '#5E5A7A',{glow:true});
    sc.box(20,20,4,7,z0+1,z0+1,'#BDE6FF',{glow:true});
    if (lv%2===0) sc.box(13,13,4,6,z0,z0,c);
  }
  sc.box(14,20,3,8,22,22,RED); sc.box(16,18,5,6,23,24,AMB); sc.set(17,5,25,'#fff');
  // the phone
  sc.box(2,9,4,4,1,19,INK); sc.box(2,9,5,5,1,19,'#24232B');
  sc.box(3,8,5,5,2,18,'#fff');
  // feed cards on the screen
  /* three games in the feed; every third of the loop it swipes up one */
  const cards = [
    z=>{ sc.box(3,8,5,5,z,z+4,'#FFD7A1'); sc.box(4,5,5,5,z+1,z+2,RED); sc.box(6,7,5,5,z+2,z+3,AMB); sc.set(5,5,z+3,GREEN); },
    z=>{ sc.box(3,8,5,5,z,z+4,'#BFE3F5'); sc.box(4,7,5,5,z+1,z+1,IND); sc.box(5,6,5,5,z+2,z+3,RED); },
    z=>{ sc.box(3,8,5,5,z,z+4,'#D8F0D2'); sc.box(4,4,5,5,z+1,z+3,GREEN); sc.box(6,7,5,5,z+1,z+1,AMB); sc.set(7,5,z+3,LIL); }
  ];
  const sw = step(3);
  cards[sw](13); cards[(sw+1)%3](7); sc.box(3,8,5,5,3,5,'#E3E0F3'); sc.box(4,4,5,5,4,4,LIL); sc.box(6,7,5,5,4,4,INK);
  sc.box(5,6,5,5,19,19,'#3A3942');
  // little avatars walking
  [[11,10,RED],[12,12,AMB],[10,12,IND]].forEach((a,k)=>{ const up = (step(6) + k*2) % 6 === 0 ? 1 : 0; sc.box(a[0],a[0],a[1],a[1],1+up,2+up,a[2]); sc.set(a[0],a[1],3+up,'#F2C29B'); });
  s += sc.render();
  // swipe arrow
  s += bob(`<g transform="translate(905,470)"><circle r="40" fill="${RED}" stroke="${INK}" stroke-width="3"/>
    <path d="M0 18V-16M-14 -2L0 -16L14 -2" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`, 14, 0, 3);
  s += `<g font-family="JetBrains Mono" font-size="18" letter-spacing="2"><rect x="1395" y="150" width="150" height="44" rx="10" fill="#fff" stroke="${INK}" stroke-width="2.5"/><text x="1416" y="179" fill="${INK}">ROOM 4721</text></g>`;
  s += spark(1520, 300, 18, AMB) + spark(860, 230, 16, '#fff') + spark(1500, 640, 14, RED);
  s += burst(1470, 160, 100, 110, 160, 3, AMB, 26);
  return [base, s];
};

/* 03 · HexaBed — a hex island */
SC[3] = function(){
  const base = chrome({ bg:'#D6E8F2', halo:'#F2FAFF', kicker:'UNITY ENGINE',
    title:[{t:'HexaBed'},{t:'worlds, built.',accent:true}], fs:100,
    lede:['160+ hex tiles, a road generator that reads','the neighbours, and an editor to drive it.'],
    chips:['Unity','C#','Editor tools','GLB'], hot:1 });
  let s='';
  const sc = new IsoScene(30, 1080, 300);
  const R = 1.0, items=[];
  const hx = (q,r)=>[ (q + r/2) * R*1.732, r * R*1.5 ];
  const H = (q,r)=>{ const v = Math.sin(q*1.3+r*.7)*1.2 + Math.cos(q*.5-r*1.1)*1.0 + 1.6; return v; };
  for(let r=-4;r<=4;r++) for(let q=-6;q<=6;q++){
    const d = Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));
    if (d>5) continue;
    const p = hx(q,r); const cx = p[0]+8, cy = p[1]+5;
    let h = Math.max(.5, H(q,r)), top, side='#8C6A47';
    const water = (q===1&&r===0)||(q===2&&r===-1)||(q===1&&r===1)||(q===-2&&r===2)||(q===-3&&r===3)||(q===2&&r===0);
    if (water){ h=.55 + .12*(.5+.5*S(1, q*.17 + r*.11)); top = S(2, q*.2+r*.13) > .3 ? '#7CC3E8' : WATER; side='#3B86B8'; }
    else if (d===5){ h = Math.min(h,1.1); top='#EBD7A6'; side='#C6A874'; }
    else if (h>2.9){ top='#B9B7B2'; side='#8D8A85'; }
    else top = (q+r)%3===0 ? '#6DBB6E' : GREEN;
    const road = (r===-1 && q>=-4 && q<=0) || (q===-1 && r>=-1 && r<=3);
    if (road && !water){ top='#5E5D66'; h = Math.max(1.2, Math.min(h,2)); }
    sc.hexPrism(cx, cy, R*.99, 0, h, top, {side});
    if (!water && !road && top!=='#B9B7B2' && d<5 && ((q*5+r*3)%4===0)){
      // tree
      const t = sc.P(cx, cy, h); const tz = 30;
      sc.add(cx+cy+h+.6, `<rect x="${t[0]-4}" y="${t[1]-26}" width="8" height="26" fill="${WOODD}" stroke="${INK}" stroke-width="2"/>
        <path d="M${t[0]} ${t[1]-78}L${t[0]+24} ${t[1]-22}H${t[0]-24}Z" fill="${GREEND}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`);
    }
    if (top==='#B9B7B2'){
      const t = sc.P(cx, cy, h);
      sc.add(cx+cy+h+.6, `<path d="M${t[0]-22} ${t[1]+4}L${t[0]-2} ${t[1]-44}L${t[0]+6} ${t[1]-30}L${t[0]+12} ${t[1]-40}L${t[0]+26} ${t[1]+4}Z" fill="#CFCCC6" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M${t[0]-10} ${t[1]-20}L${t[0]-2} ${t[1]-44}L${t[0]+6} ${t[1]-30}L${t[0]} ${t[1]-24}Z" fill="#fff"/>`);
    }
    if (q===3&&r===-3){ // a house
      const t = sc.P(cx, cy, h);
      sc.add(cx+cy+h+.7, `<g transform="translate(${t[0]},${t[1]})"><path d="M-20 0V-28L0 -40L20 -28V0L0 10Z" fill="#F6F0E2" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M-24 -26L0 -52L24 -26L0 -38Z" fill="${RED}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/><rect x="-6" y="-16" width="9" height="14" fill="${IND}"/></g>`);
    }
    if (q===-4&&r===2){
      const t = sc.P(cx, cy, h);
      sc.add(cx+cy+h+.7, `<g transform="translate(${t[0]},${t[1]})"><path d="M-18 0V-24L0 -34L18 -24V0L0 9Z" fill="#F6F0E2" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M-22 -22L0 -46L22 -22L0 -32Z" fill="${AMB}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/></g>`);
    }
  }
  s += shadow(1090, 720, 340, 60, .12);
